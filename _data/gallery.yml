# Gallery albums, newest first.
#
# To add a photo
#   1. Upload the image to assets/img/gallery/ on GitHub.
#   2. Add an entry under an album below with its file name and a caption.
# Optional per photo
#   ar      width divided by height (worked out automatically if left out)
#   A smaller copy with the same name in assets/img/gallery/thumbs/ makes the
#   page load faster, and is used automatically when it exists.
# Optional per album
#   description   a short line shown above the album's photos.

